<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendo - Making attendance faster using AI</title>
  <meta name="description" content="Attendo marks attendance in seconds with face recognition and voice. Built for teachers and students.">
  <meta name="theme-color" content="#f4f0ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1030" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = localStorage.getItem('attendo.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  </script>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div id="app" class="app"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Attendo needs JavaScript to run. Please enable it in your browser.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
